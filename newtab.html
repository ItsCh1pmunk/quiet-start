<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>收藏夹</title>
  <link rel="icon" href="assets/icon-32.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <div class="celestial-stage" aria-hidden="true">
    <svg class="celestial-halo" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMin slice">
      <defs>
        <radialGradient id="halo-aura" cx="50%" cy="17%" r="54%">
          <stop offset="0%" class="aura-core"/>
          <stop offset="38%" class="aura-mid"/>
          <stop offset="100%" class="aura-edge"/>
        </radialGradient>
        <linearGradient id="ray-fade" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" class="ray-start"/>
          <stop offset="100%" class="ray-end"/>
        </linearGradient>
      </defs>
      <rect width="1200" height="700" fill="url(#halo-aura)"/>
      <g class="halo-rays" transform="translate(600 120)">
        <line x1="0" y1="0" x2="0" y2="-440"/>
        <line x1="0" y1="0" x2="114" y2="-425"/>
        <line x1="0" y1="0" x2="220" y2="-381"/>
        <line x1="0" y1="0" x2="311" y2="-311"/>
        <line x1="0" y1="0" x2="381" y2="-220"/>
        <line x1="0" y1="0" x2="425" y2="-114"/>
        <line x1="0" y1="0" x2="440" y2="0"/>
        <line x1="0" y1="0" x2="425" y2="114"/>
        <line x1="0" y1="0" x2="381" y2="220"/>
        <line x1="0" y1="0" x2="311" y2="311"/>
        <line x1="0" y1="0" x2="220" y2="381"/>
        <line x1="0" y1="0" x2="114" y2="425"/>
        <line x1="0" y1="0" x2="0" y2="440"/>
        <line x1="0" y1="0" x2="-114" y2="425"/>
        <line x1="0" y1="0" x2="-220" y2="381"/>
        <line x1="0" y1="0" x2="-311" y2="311"/>
        <line x1="0" y1="0" x2="-381" y2="220"/>
        <line x1="0" y1="0" x2="-425" y2="114"/>
        <line x1="0" y1="0" x2="-440" y2="0"/>
        <line x1="0" y1="0" x2="-425" y2="-114"/>
        <line x1="0" y1="0" x2="-381" y2="-220"/>
        <line x1="0" y1="0" x2="-311" y2="-311"/>
        <line x1="0" y1="0" x2="-220" y2="-381"/>
        <line x1="0" y1="0" x2="-114" y2="-425"/>
      </g>
      <g class="halo-rings" transform="translate(600 120)">
        <circle r="160"/>
        <circle r="240"/>
        <circle class="halo-dashed" r="280"/>
        <circle r="320"/>
        <circle r="410"/>
        <path class="rose-petals" d="M 0 -240 Q 90 -90 240 0 Q 90 90 0 240 Q -90 90 -240 0 Q -90 -90 0 -240 Z"/>
        <path class="rose-petals" transform="rotate(45)" d="M 0 -240 Q 90 -90 240 0 Q 90 90 0 240 Q -90 90 -240 0 Q -90 -90 0 -240 Z"/>
        <path class="rose-petals-outer" d="M 0 -320 L 42 -42 L 320 0 L 42 42 L 0 320 L -42 42 L -320 0 L -42 -42 Z"/>
      </g>
      <g class="halo-stars">
        <path d="M600 18 L603 28 L613 31 L603 34 L600 44 L597 34 L587 31 L597 28 Z"/>
        <path d="M600 271 L602.5 278.5 L610 281 L602.5 283.5 L600 291 L597.5 283.5 L590 281 L597.5 278.5 Z"/>
        <path d="M280 112 L282.5 117.5 L288 120 L282.5 122.5 L280 128 L277.5 122.5 L272 120 L277.5 117.5 Z"/>
        <path d="M920 112 L922.5 117.5 L928 120 L922.5 122.5 L920 128 L917.5 122.5 L912 120 L917.5 117.5 Z"/>
      </g>
    </svg>
  </div>

  <div class="page-shell">
    <header class="sanctuary-header">
      <div class="masthead">
        <svg class="sanctuary-crest" viewBox="0 0 36 36" aria-hidden="true">
          <circle class="crest-ring" cx="18" cy="18" r="15.5"/>
          <circle class="crest-ring-inner" cx="18" cy="18" r="11"/>
          <path class="crest-rays" d="M9 9 27 27M27 9 9 27"/>
          <path class="crest-star" d="M18 3.5 20.6 15.4 32.5 18 20.6 20.6 18 32.5 15.4 20.6 3.5 18 15.4 15.4Z"/>
        </svg>
        <div class="wordmark-stack">
          <span class="wordmark-title">QUIET START</span>
          <span class="wordmark-sub"><i class="star-dot" aria-hidden="true"></i>静 启 书 阁<i class="star-dot" aria-hidden="true"></i></span>
        </div>
      </div>

      <div class="command-bar">
        <label class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.6"/><path d="m16 16 4.3 4.3"/></svg>
          <input id="search" type="search" placeholder="搜索书签与站点…" aria-label="搜索收藏夹" autocomplete="off" spellcheck="false">
          <kbd aria-hidden="true">⌘K</kbd>
        </label>
        <label class="folder-chip">
          <svg class="folder-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4.6l2 2H19a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
          <select id="choose-folder" class="quick-folder-select" aria-label="选择收藏夹" disabled><option>正在读取…</option></select>
          <svg class="folder-chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.5 8 10l3.5-3.5"/></svg>
        </label>
      </div>
    </header>

    <main id="main" aria-busy="true">
      <h1 class="visually-hidden">收藏夹</h1>
      <p id="summary" class="visually-hidden" role="status">正在读取 Chrome 书签…</p>
      <div class="collection-surface">
        <svg class="corner-star tl" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1 9.5 6.5 15 8 9.5 9.5 8 15 6.5 9.5 1 8 6.5 6.5Z"/></svg>
        <svg class="corner-star tr" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1 9.5 6.5 15 8 9.5 9.5 8 15 6.5 9.5 1 8 6.5 6.5Z"/></svg>
        <svg class="corner-star bl" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1 9.5 6.5 15 8 9.5 9.5 8 15 6.5 9.5 1 8 6.5 6.5Z"/></svg>
        <svg class="corner-star br" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1 9.5 6.5 15 8 9.5 9.5 8 15 6.5 9.5 1 8 6.5 6.5Z"/></svg>

        <nav id="breadcrumbs" class="breadcrumbs" aria-label="文件夹路径" hidden></nav>
        <div id="notice" class="notice" role="status" hidden></div>
        <div id="content"></div>
        <div id="empty" class="empty-state" hidden>
          <div class="empty-symbol" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 2.5 14.3 9.7 21.5 12 14.3 14.3 12 21.5 9.7 14.3 2.5 12 9.7 9.7Z"/></svg>
          </div>
          <h2 id="empty-title">这里还没有书签</h2>
          <p id="empty-description">按 ⌘ D 收藏一个网站，或选择其他书签文件夹。</p>
          <button id="empty-folder" class="text-button" type="button">选择文件夹</button>
        </div>
      </div>
      <noscript>请在 Chrome 中启用 JavaScript 后重新打开新标签页。</noscript>
    </main>
  </div>

  <footer class="page-footer"><span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2 4 4v5c0 4 6 7 6 7s6-3 6-7V4Z"/><path d="m7 9 2 2 4-4"/></svg>本地运行</span></footer>

  <button id="settings-button" class="settings-button" type="button" aria-label="自定起始页" aria-haspopup="dialog" title="自定起始页">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.5"/><circle cx="15" cy="17" r="2.5"/></svg><span>自定</span>
  </button>

  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <div class="dialog-heading">
      <div>
        <span class="eyebrow">AUREOLE · QUIET START</span>
        <h2 id="settings-title">自定起始页</h2>
      </div>
      <button id="close-settings" class="icon-button" aria-label="关闭设置" type="button">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5 11.5 11.5M11.5 4.5 4.5 11.5"/></svg>
      </button>
    </div>
    <div class="settings-section">
      <label class="field-label" for="folder-select">书签文件夹</label>
      <div class="select-wrap">
        <select id="folder-select" aria-describedby="folder-help"></select>
        <svg class="select-chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.5 8 10l3.5-3.5"/></svg>
      </div>
      <p class="field-help" id="folder-help">自动读取 Chrome 书签，修改后即时更新。</p>
    </div>
    <div class="settings-section layout-settings">
      <div class="range-heading"><label for="icon-size">图标大小</label><output id="icon-size-value" for="icon-size">64 px</output></div>
      <input id="icon-size" type="range" min="40" max="88" step="4" value="64">
      <div class="range-captions" aria-hidden="true"><span>小</span><span>大</span></div>
      <div class="range-heading"><label for="columns">每行数量</label><output id="columns-value" for="columns">8 个</output></div>
      <input id="columns" type="range" min="4" max="12" step="1" value="8" aria-describedby="columns-help">
      <p class="field-help" id="columns-help">窄窗口会自动减少列数，保持图标清晰。</p>
    </div>
    <div class="settings-section toggles">
      <label class="toggle-row"><span><strong>按文件夹分组</strong><small>展示所有层级的书签</small></span><input id="grouped" type="checkbox" role="switch" checked></label>
      <label class="toggle-row"><span><strong>仅使用字母图标</strong><small>不读取 Chrome 网站图标</small></span><input id="letters-only" type="checkbox" role="switch"></label>
    </div>
    <div class="settings-note"><span class="theme-indicator" aria-hidden="true"></span><p>外观自动跟随系统。设置仅保存在本机，不上传书签。</p></div>
    <div class="dialog-footer"><span id="save-status" role="status">设置自动保存</span><button id="reset-settings" class="text-button" type="button">恢复默认</button></div>
  </dialog>
</body>
</html>
